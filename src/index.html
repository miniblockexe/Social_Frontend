<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Social</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF4D3D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Social" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="assets/icons/icon-152.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0c0c0e; 
      }

      app-root {
        display: block;
        height: 100%;
      }

      @keyframes _spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes _pulse {
        0%,
        100% {
          opacity: 0.85;
          transform: scale(0.97);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes _slide {
        from {
          transform: translateX(-120%);
        }
        to {
          transform: translateX(520%);
        }
      }

      /* ── Shell ── */
      .sp-splash {
        position: fixed;
        inset: 0;
        background: #0c0c0e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        z-index: 9999;
      }

      .sp-ring-wrap {
        position: relative;
        width: 72px;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .sp-ring-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        animation: _spin 1.1s linear infinite;
      }

      .sp-logo {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: #ff4d3d;
        color: #fff;
        font-family: -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px rgba(255, 77, 61, 0.25);
        animation: _pulse 1.8s ease-in-out infinite;
      }

      /* ── Wordmark ── */
      .sp-wordmark {
        font-family: -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
        font-size: 20px;
        font-weight: 700;
        color: #e8e8ea;
        letter-spacing: -0.2px;
        line-height: 1;
      }
      .sp-wordmark b {
        color: #ff4d3d;
        font-weight: 800;
      }

      .sp-progress {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: rgba(255, 77, 61, 0.1);
        overflow: hidden;
      }

      .sp-progress-thumb {
        height: 100%;
        width: 25%;
        background: linear-gradient(
          90deg,
          transparent 0%,
          #ff4d3d 50%,
          transparent 100%
        );
        animation: _slide 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* ── Reduced motion ── */
      @media (prefers-reduced-motion: reduce) {
        .sp-ring-svg,
        .sp-logo,
        .sp-progress-thumb {
          animation: none;
        }

        .sp-logo {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="sp-splash" aria-hidden="true" role="presentation">
        <div class="sp-ring-wrap">
          <svg
            class="sp-ring-svg"
            viewBox="0 0 72 72"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <!-- Track mờ -->
            <circle
              cx="36"
              cy="36"
              r="32"
              stroke="rgba(255,77,61,.12)"
              stroke-width="3.5"
            />
            <!-- Arc xoay -->
            <circle
              cx="36"
              cy="36"
              r="32"
              stroke="#ff4d3d"
              stroke-width="3.5"
              stroke-linecap="round"
              stroke-dasharray="50 151"
              stroke-dashoffset="0"
            />
          </svg>
          <div class="sp-logo" aria-hidden="true">S</div>
        </div>

        <div class="sp-wordmark" aria-hidden="true"><b>S</b>ocial</div>

        <div class="sp-progress" aria-hidden="true">
          <div class="sp-progress-thumb"></div>
        </div>
      </div>
    </app-root>
  </body>
</html>
