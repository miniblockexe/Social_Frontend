<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Social</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF4D3D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Social" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="assets/icons/icon-152.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0c0c0e;
      }

      app-root {
        display: block;
        height: 100%;
      }

      @keyframes sp-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes sp-pulse {
        0%,
        100% {
          opacity: 0.4;
          transform: scale(0.95);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      .sp-shell {
        position: fixed;
        inset: 0;
        background: #0c0c0e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        z-index: 9999;
      }

      .sp-ring {
        width: 48px;
        height: 48px;
        animation: sp-spin 1.1s linear infinite;
        transform-origin: center;
      }

      .sp-wordmark {
        font-family: -apple-system, "Segoe UI", sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: #f0f0f2;
        letter-spacing: -0.3px;
        animation: sp-pulse 1.8s ease-in-out infinite;
      }

      .sp-wordmark span {
        color: #ff4d3d;
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="sp-shell" aria-hidden="true">
        <svg class="sp-ring" viewBox="0 0 48 48" fill="none">
          <circle
            cx="24"
            cy="24"
            r="20"
            stroke="rgba(255,77,61,0.15)"
            stroke-width="3.5"
          />
          <circle
            cx="24"
            cy="24"
            r="20"
            stroke="#ff4d3d"
            stroke-width="3.5"
            stroke-linecap="round"
            stroke-dasharray="32 94"
          />
        </svg>
        <div class="sp-wordmark"><span>S</span>ocial</div>
      </div>
    </app-root>
  </body>
</html>
